version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/glpi.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app

build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: glpi
    source: docker.io/glpi/glpi
    channel: stable
    tag_regex: '^11\.\d+\.\d+$'   # 锁在 11.x：12.0.0 属大版本，需人工评估后再放开
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh-CN
      - en-US
  private:
    enabled: false
