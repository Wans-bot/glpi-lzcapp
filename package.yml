package: cloud.lazycat.app.glpi
version: 11.0.11
name: GLPI
description: 开源 IT 资产与 ITIL 服务台管理平台（资产管理/工单/知识库/许可证追踪）
author: LazyMonitor
license: GPL-3.0
homepage: https://github.com/glpi-project/glpi
min_os_version: 1.6.0
permissions:
  required:
    - net.internet
    - document.private
locales:
  zh-CN:
    name: GLPI 资产管理台
    description: 开源 IT 资产与 ITIL 服务台管理平台，覆盖资产台账、工单报修、知识库、许可证追踪与报表，内置简体中文界面
    usage: >-
      ## 登录信息

      - 管理员账号：glpi

      - 初始密码：glpi

      （打开应用会自动登录；首次登录后请尽快在「我的设置 → 修改密码」里改掉默认密码，GLPI 会在页面上持续提示默认密码不安全）


      ## 首次打开要等一会儿

      第一次安装后打开，页面会先显示「GLPI 正在初始化」，此时后台正在建库（约 400 张表）。通常 1~3 分钟，最多约 5 分钟，完成后页面会自动跳到控制台。期间不要反复重启应用。


      ## 开始使用

      1. 打开应用即进入「中央控制台」（仪表板）。首次安装自带一份演示数据，页面上有「你正在查看演示数据」的提示条，点「停用演示」即可清空，换成自己的数据。

      2. 先做基础配置：管理 → 实体、地点、用户；按部门用「实体」隔离权限。

      3. 录入资产：资产 → 计算机 → 新增，填名称、状态、地点、用户；网络设备、打印机、软件、许可证在同级菜单。

      4. 报修与工单：协助 → 工单 → 新增，可关联资产、指派工程师、设置 SLA 与截止时间。

      5. 上传附件、导出 CSV、下载备份时，文件选择器会弹出「网盘文件 / 本地文件」两个来源，可直接把微服网盘里的文件读进来，也能把导出结果存回网盘。


      ## 场景示例

      - 小团队 IT 台账：把办公电脑、打印机、显示器登记成资产，谁在用、什么时候买的一目了然。

      - 报修闭环：员工提交工单 → 主管指派 → 工程师处理并记录耗时 → 工单关闭，全过程留痕可查。

      - 许可证与合同：把软件许可证、维保合同挂到对应资产上，到期前靠「提醒」列表集中处理。


      ## 使用技巧

      - 仪表板是拖拽式的：右上角「+」添加小部件，「编辑」模式下可换布局；每个用户可以有自己的一套仪表板。

      - 批量导入：管理 → 数据注入 / CSV 导入，几百台设备不必一条条录。

      - 工单模板：协助 → 模板，把「换硒鼓」「开通账号」这类高频请求做成模板，提交时一键带出字段。

      - 备份：管理 → 维护 → 备份 生成 GLPI 自己的 SQL 备份；应用数据本身也随微服备份一起走（数据库在应用数据目录里）。


      ## 常见问题

      - 打开显示「正在初始化」超过 10 分钟：先在应用管理里重启一次；仍不行的重装应用（数据库会自愈重建，首次安装状态下不会丢数据）。

      - 忘记密码：管理员可在 管理 → 用户 里重置任意用户密码。

      - 界面是英文：管理 → 设置 → 通用 → 语言，选「简体中文」后保存。

      - 收不到通知邮件：需要先在 管理 → 通知 → 邮件服务器 里配置 SMTP。
  en-US:
    name: GLPI
    description: >-
      Open-source IT asset and ITIL service desk platform with asset inventory, ticketing, knowledge base, license tracking and reports
    usage: >-
      ## Sign-in

      - Administrator account: glpi

      - Initial password: glpi

      (Opening the app signs you in automatically. Change the default password right after the first sign-in — GLPI keeps warning about it.)


      ## The first start takes a while

      On a fresh installation the page first shows "GLPI is initializing" while the database is created (about 400 tables). This usually takes 1-3 minutes (up to roughly 5 on a slow machine). The page then switches to the dashboard by itself. Do not restart the app repeatedly while it is initializing.


      ## Getting started

      1. Opening the app lands on the central dashboard. A fresh install ships with demonstration data; use the "Disable demonstration" button to drop it and start with your own records.

      2. Configure the basics first: Administration -> Entities, Locations, Users. Use Entities to separate departments and scope permissions.

      3. Register assets: Assets -> Computers -> Add, filling in name, status, location and user. Network devices, printers, software and licenses live in the same menu.

      4. Tickets: Assistance -> Tickets -> Add. Link them to assets, assign an engineer, set SLA and due dates.

      5. When you upload attachments, export CSV or download backups, the file picker offers "LazyCat drive / Local file", so files can be read from and written back to the LazyCat drive.


      ## Example use cases

      - A small-team IT ledger: record laptops, printers and monitors, and see who uses what and when it was bought.

      - Ticket workflow: an employee files a ticket, a manager assigns it, the engineer records the fix, and the ticket is closed with a full history.

      - Licenses and contracts: attach software licenses and maintenance contracts to the assets they cover and handle them from the reminders list before they expire.


      ## Tips

      - The dashboard is drag-and-drop: add widgets with the "+" button, rearrange them in edit mode. Every user can keep their own layout.

      - Bulk import: Administration -> Data injection / CSV import, so you do not have to type hundreds of devices one by one.

      - Ticket templates: Assistance -> Templates. Turn frequent requests (replace toner, create account) into templates that prefill the form.

      - Backup: Administration -> Maintenance -> Backup creates GLPI's own SQL dump. The application's data directory is also covered by the LazyCat backup.


      ## FAQ

      - "Initializing" for more than 10 minutes: restart the app once from the app manager. If it still does not come up, reinstall it — the database layer repairs itself on start, which is safe while the instance is still fresh.

      - Forgot the password: an administrator can reset any user in Administration -> Users.

      - Interface language: Administration -> Setup -> General -> Language.

      - No notification e-mails until Administration -> Notifications -> Mail server is configured.
